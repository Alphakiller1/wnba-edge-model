name: deploy-pages

on:
  push:
    branches:
      - main
  schedule:
    # Daily slate: afternoon ET after same-day boards open, plus a late-night
    # rebuild after West Coast tips. Rebuilds from committed CSVs only — this
    # workflow does not call --fetch-odds (that spend lives in daily-model.yml).
    - cron: "15 18 * * *"
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install model
        run: pip install .
      - name: Build static dashboard from committed data
        run: python -m wnba_edges.cli build-site --season 2026-27 --out _site/index.html
      - name: Post-build smoke
        run: |
          python - <<'EOF'
          from pathlib import Path
          html = Path('_site/index.html').read_text(encoding='utf-8')
          for key in ('Game Projections', 'Market Snapshot', 'Stale Anchor Board',
                      'Graded Results', 'not betting advice', '1-800-GAMBLER'):
              assert key in html, key
          # Shared brand contract: vendored Chase tokens + board kernel must reach the page.
          for key in ('#08090F', '#9A6BFF', 'DM Sans', 'Roboto Condensed', 'bd-card'):
              assert key in html, key
          for forked in ('IBM Plex', '#BA008E', 'Barlow'):
              assert forked not in html, f'off-brand token resurfaced: {forked}'
          # Features must always resolve. Projections may honestly be empty when
          # there is no game inside the current schedule window, so distinguish
          # that header-only slate from a missing data root.
          assert 'No feature board yet' not in html, 'features data not found at build time'
          projection_path = Path('data/processed/game_projections_2026-27.csv')
          assert projection_path.exists(), 'projections data not found at build time'
          if 'No game projections yet' in html:
              lines = projection_path.read_text(encoding='utf-8').splitlines()
              assert len(lines) == 1 and 'book_total_line' in lines[0], 'unexpected empty projection state'
          print(f"OK: {len(html)//1024} KB")
          EOF
          python - <<'EOF'
          import json
          from pathlib import Path
          board = json.loads(Path('_site/board.json').read_text(encoding='utf-8'))
          build = json.loads(Path('_site/build.json').read_text(encoding='utf-8'))
          record = json.loads(Path('_site/record.json').read_text(encoding='utf-8'))
          assert board['schema'] == 'wnba-edge-model/board/1'
          assert board['authority'] == 'RESEARCH_ONLY'
          assert board['may_bet'] is False
          assert 'unmet_gates' in board
          assert 'games' in board and 'player_projections' in board
          assert 'state' in build and 'generated_at' in build and 'odds' in build
          assert 'issues' in build and 'sources' in build
          assert record['authority'] == 'shadow_only'
          assert record['may_bet'] is False
          for key in ('games_graded', 'pending_snapshots', 'model_mae', 'consensus_mae',
                      'book_mae', 'ats', 'totals'):
              assert key in record, key
          print('OK: board/build/record JSON contract')
          EOF
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
