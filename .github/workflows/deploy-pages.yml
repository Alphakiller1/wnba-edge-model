name: deploy-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install model
        run: pip install .
      - name: Build static dashboard from committed data
        run: python -m wnba_edges.cli build-site --season 2026-27 --out _site/index.html
      - name: Post-build smoke
        run: |
          python - <<'EOF'
          from pathlib import Path
          html = Path('_site/index.html').read_text(encoding='utf-8')
          for key in ('Game Projections', 'Market Snapshot', 'Edge Watchboard',
                      'Graded Results', 'not betting advice', '1-800-GAMBLER'):
              assert key in html, key
          print(f"OK: {len(html)//1024} KB")
          EOF
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
