name: daily WNBA model

on:
  schedule:
    # 2:15 PM Eastern during daylight time, after most same-day prop boards open.
    - cron: "15 18 * * *"
  workflow_dispatch:
    inputs:
      refresh_model:
        description: Fetch odds and run the model before publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-wnba-model
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_BOOKMAKERS: draftkings
      WNBA_PROP_MARKETS: player_points,player_rebounds,player_assists,player_threes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install model
        run: pip install .
      - name: Refresh season data feeding the matrix
        if: github.event_name == 'schedule' || inputs.refresh_model
        run: |
          python -m wnba_edges.cli refresh-season --season 2026-27
          python -m wnba_edges.cli build-features --season 2026-27
      - name: Fetch DraftKings game and modeled prop lines
        if: github.event_name == 'schedule' || inputs.refresh_model
        run: |
          test -n "$ODDS_API_KEY" || { echo "ODDS_API_KEY secret is missing"; exit 1; }
          python -m wnba_edges.market_data --fetch-slate --bookmakers draftkings
          python -m wnba_edges.market_data --fetch-slate --props --bookmakers draftkings
          python -m wnba_edges.market_data --validate-latest --bookmakers draftkings
      - name: Grade prior forecasts and run current slate
        if: github.event_name == 'schedule' || inputs.refresh_model
        run: |
          python -m wnba_edges.cli grade-predictions --season 2026-27
          python -m wnba_edges.cli build-game-projections --season 2026-27 --days 2
      - name: Require available DraftKings props to reach Best Bets
        if: github.event_name == 'schedule' || inputs.refresh_model
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          props = pd.read_csv(Path("data/processed/prop_projections_2026-27.csv"))
          bets = pd.read_csv(Path("data/processed/daily_best_bets_2026-27.csv"))
          priced = props[props["priced"].astype(str).str.lower().isin({"true", "1"})]
          prop_bets = bets[bets["family"].astype(str).str.lower().eq("prop")]
          print(f"priced player props: {len(priced)}; player props in Best Bets: {len(prop_bets)}")
          if not priced.empty and prop_bets.empty:
              raise SystemExit("Priced DraftKings player props exist but Daily Best Bets contains none")
          PY
      - name: Build dashboard
        run: python -m wnba_edges.cli build-site --season 2026-27 --out docs/index.html
      - name: Commit the timestamped run and grading state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/index.html
          if git diff --cached --quiet; then
            echo "No model data changed"
            exit 0
          fi
          git commit -m "Run daily WNBA model with DraftKings props"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
