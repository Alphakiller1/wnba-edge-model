name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests
      - name: pytest
        run: pytest -q
      - name: dashboard builds from committed data
        run: |
          python -m wnba_edges.cli build-site --season 2026-27 --out _smoke/index.html
          python - <<'EOF'
          from pathlib import Path
          html = Path('_smoke/index.html').read_text(encoding='utf-8')
          for key in ('Game Projections', 'Market Snapshot', 'Edge Watchboard',
                      'Graded Results', 'not betting advice'):
              assert key in html, key
          # Shared brand contract: the vendored Chase tokens + board kernel must survive
          # into the built page, or this product has silently forked off-brand.
          for key in ('#08090F', '#9A6BFF', 'DM Sans', 'Roboto Condensed', 'bd-card'):
              assert key in html, key
          print(f"OK: {len(html)//1024} KB, all layers present")
          EOF
