[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wnba-edge-model"
version = "0.1.0"
description = "WNBA data scrapers and early edge model feature pipeline"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.4",
]

[project.scripts]
wnba-edges = "wnba_edges.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Pre-existing table-building code favors wide one-line dict rows; length is not
# where this repo's risk lives.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
