[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wnba-edge-model"
version = "0.1.0"
description = "WNBA data scrapers and early edge model feature pipeline"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "boto3>=1.34",
]

[project.scripts]
wnba-edges = "wnba_edges.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
